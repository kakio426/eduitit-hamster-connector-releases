name: Validate Windows companion
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to validate
        required: true
        default: v0.5.0
      expected_sha256:
        description: SHA-256 of the candidate ZIP
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download candidate
        shell: pwsh
        env:
          CANDIDATE_ZIP_URL: ${{ secrets.CANDIDATE_ZIP_URL }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          New-Item -ItemType Directory candidate
          $file = 'candidate/EduititHamsterConnector-Windows-x64.zip'
          Invoke-WebRequest -Uri $env:CANDIDATE_ZIP_URL -OutFile $file
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:EXPECTED_SHA256) { throw 'Candidate checksum mismatch' }
          Expand-Archive $file -DestinationPath extracted
      - name: Run embedded runtime, model, safety tests and native window
        shell: pwsh
        run: |
          $parent = Join-Path $PWD 'OneDrive - 용인교육지원청/교사 로봇 체험'
          New-Item -ItemType Directory -Path $parent -Force
          Move-Item 'extracted/EduititHamsterConnector-Windows-x64' $parent
          $root = Join-Path $parent 'EduititHamsterConnector-Windows-x64'
          & "$root/runtime/python.exe" "$root/qa_release.py"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release QA failed' }
          @{windows_execution_verified=$true; unicode_install_path_verified=$true; hardware_verified=$false; run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"; candidate_sha256=(Get-FileHash 'candidate/*.zip' -Algorithm SHA256).Hash.ToLower(); checked_at=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json | Set-Content -Encoding utf8 WINDOWS_VERIFICATION.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: WINDOWS_VERIFICATION.json
